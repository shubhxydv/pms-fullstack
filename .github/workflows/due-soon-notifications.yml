name: Due-soon push notifications

on:
  schedule:
    # 08:00 IST daily (02:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the due-soon cron endpoint
        run: |
          curl -sf -X POST https://pms-backend-qiir.onrender.com/api/notifications/cron/due-soon \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
